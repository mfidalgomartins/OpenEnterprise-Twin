name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, type and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e ./backend
          python -m pip check
      - name: Lint
        working-directory: backend
        run: python -m ruff check src tests
      - name: Type and boundary checks
        working-directory: backend
        run: |
          python -m mypy src
          lint-imports
      - name: Unit tests
        working-directory: backend
        run: |
          mkdir -p test-results
          python -m pytest tests/unit -q --junitxml=test-results/backend-unit.xml
      - name: Upload failed backend report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-failure-report
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  postgres-integration:
    name: PostgreSQL migration and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openenterprise_twin
          POSTGRES_USER: openenterprise_twin
          POSTGRES_PASSWORD: openenterprise_twin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openenterprise_twin -d openenterprise_twin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENENTERPRISE_TWIN_DATABASE_URL: postgresql+psycopg://openenterprise_twin:openenterprise_twin@127.0.0.1:5432/openenterprise_twin
      OPENENTERPRISE_TWIN_TEST_POSTGRES_URL: postgresql+psycopg://openenterprise_twin:openenterprise_twin@127.0.0.1:5432/openenterprise_twin
      OPENENTERPRISE_TWIN_ARTIFACT_DIRECTORY: artifacts
      OPENENTERPRISE_TWIN_EXPERIMENT_WORKERS: "1"
      OPENENTERPRISE_TWIN_REPLICATION_WORKERS_PER_EXPERIMENT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e ./backend
          python -m pip check
      - name: Apply reversible migration
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Seed Northstar and verify PostgreSQL-backed API
        env:
          OPENENTERPRISE_TWIN_AUTHENTICATION_MODE: api_key
          OPENENTERPRISE_TWIN_API_KEY: ci-only-public-test-key-0000000000000000
          OPENENTERPRISE_TWIN_BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p backend/test-results
          cd backend
          python -m openenterprise_twin.cli.demo seed
          python -m uvicorn openenterprise_twin.api.app:create_app \
            --factory --host 127.0.0.1 --port 8000 \
            >test-results/postgres-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat test-results/postgres-api.log
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          from openenterprise_twin import __version__

          base_url = "http://127.0.0.1:8000"
          api_key = os.environ["OPENENTERPRISE_TWIN_API_KEY"]
          build_commit = os.environ["OPENENTERPRISE_TWIN_BUILD_COMMIT"]

          assert len(api_key) >= 32

          def request_json(
              path: str,
              *,
              expected_status: int = 200,
              authenticated: bool = False,
          ) -> dict[str, object]:
              headers = {"X-API-Key": api_key} if authenticated else {}
              request = Request(f"{base_url}{path}", headers=headers)
              try:
                  with urlopen(request, timeout=5) as response:
                      status = response.status
                      body = response.read()
              except HTTPError as error:
                  status = error.code
                  body = error.read()
              assert status == expected_status, (path, status, body)
              payload = json.loads(body)
              assert isinstance(payload, dict), (path, payload)
              return payload

          health = request_json("/health")
          assert health == {"status": "ok"}

          ready = request_json("/ready")
          assert ready == {
              "status": "ready",
              "checks": {"artifacts": "ready", "database": "ready"},
          }

          unauthorized = request_json(
              "/api/v1/system/info",
              expected_status=401,
          )
          assert unauthorized["code"] == "authentication_required"

          system_info = request_json(
              "/api/v1/system/info",
              authenticated=True,
          )
          assert set(system_info) == {
              "name",
              "version",
              "environment",
              "build_commit",
              "capabilities",
          }
          assert system_info["name"] == "OpenEnterprise Twin"
          assert isinstance(system_info["version"], str)
          assert system_info["version"] == __version__
          assert re.fullmatch(
              r"\d+\.\d+\.\d+(?:[a-zA-Z0-9.+-]*)?",
              system_info["version"],
          )
          assert system_info["environment"] in {
              "development",
              "test",
              "production",
          }
          assert re.fullmatch(r"[0-9a-f]{40}", build_commit)
          assert system_info["build_commit"] == build_commit
          capabilities = system_info["capabilities"]
          assert isinstance(capabilities, list) and capabilities
          assert capabilities == sorted(set(capabilities))
          assert all(
              isinstance(capability, str)
              and re.fullmatch(r"[a-z][a-z0-9_]*", capability)
              for capability in capabilities
          )
          serialized_system_info = json.dumps(system_info).lower()
          assert api_key.lower() not in serialized_system_info
          assert all(
              forbidden not in serialized_system_info
              for forbidden in (
                  "api_key",
                  "artifact_directory",
                  "database_url",
                  "postgresql://",
                  "postgresql+psycopg://",
              )
          )

          current_plan = request_json(
              "/api/v1/scenarios/current-plan",
              authenticated=True,
          )
          assert current_plan["company_model_version"] == "0.2.0"
          PY
      - name: API integration tests
        working-directory: backend
        run: |
          mkdir -p test-results
          python -m pytest tests/integration -q --junitxml=test-results/backend-integration.xml
      - name: Upload failed integration report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-failure-report
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend lint, type, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: |
          mkdir -p test-results
          npm run test -- --run --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: Production build
        working-directory: frontend
        run: |
          npm run build
          node - <<'NODE'
          const { readdirSync, statSync } = require("node:fs");
          const files = readdirSync("dist/assets")
            .filter((name) => name.endsWith(".js"))
            .map((name) => ({ name, bytes: statSync(`dist/assets/${name}`).size }));
          const total = files.reduce((sum, file) => sum + file.bytes, 0);
          const budget = 500_000;
          if (total > budget) {
            throw new Error(`JavaScript bundle ${total} bytes exceeds ${budget}`);
          }
          console.log(`javascript_bundle_bytes=${total} budget_bytes=${budget}`);
          NODE
      - name: Upload failed frontend report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-failure-report
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Production container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: |
          docker build --file backend/Dockerfile --tag openenterprise-twin-api:ci backend
          docker build --file frontend/Dockerfile --tag openenterprise-twin-web:ci frontend

  e2e:
    name: End-to-end release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, postgres-integration, frontend, containers]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openenterprise_twin
          POSTGRES_USER: openenterprise_twin
          POSTGRES_PASSWORD: openenterprise_twin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openenterprise_twin -d openenterprise_twin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENENTERPRISE_TWIN_DATABASE_URL: postgresql+psycopg://openenterprise_twin:openenterprise_twin@127.0.0.1:5432/openenterprise_twin
      OPENENTERPRISE_TWIN_ARTIFACT_DIRECTORY: artifacts
      OPENENTERPRISE_TWIN_EXPERIMENT_WORKERS: "1"
      OPENENTERPRISE_TWIN_REPLICATION_WORKERS_PER_EXPERIMENT: "1"
      OPENENTERPRISE_TWIN_CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:4173"]'
      OPENENTERPRISE_TWIN_DEPLOYMENT_ENVIRONMENT: test
      OPENENTERPRISE_TWIN_AUTHENTICATION_MODE: oidc
      OPENENTERPRISE_TWIN_OIDC_ISSUER: http://127.0.0.1:18081/
      OPENENTERPRISE_TWIN_OIDC_AUDIENCE: openenterprise-twin
      OPENENTERPRISE_TWIN_OIDC_JWKS_URL: http://127.0.0.1:18081/jwks
      OPENENTERPRISE_TWIN_JOB_WORKER_MODE: embedded
      OPENENTERPRISE_TWIN_JOB_WORKERS: "1"
      LIVE_E2E: "1"
      OIDC_E2E: "1"
      VITE_API_BASE_URL: http://127.0.0.1:8000
      VITE_AUTH_MODE: oidc
      VITE_OIDC_AUTHORITY: http://127.0.0.1:18081/
      VITE_OIDC_CLIENT_ID: openenterprise-twin-browser
      VITE_OIDC_REDIRECT_URI: http://127.0.0.1:4173/auth/callback
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:4173/
      VITE_OIDC_SCOPE: openid profile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application and browser
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e ./backend
          python -m pip check
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        run: |
          mkdir -p test-results
          python backend/tests/fixtures/oidc_server.py \
            >test-results/e2e-oidc.log 2>&1 &
          oidc_pid=$!
          cd backend
          python -m alembic upgrade head
          python -m openenterprise_twin.cli.demo seed
          python -m uvicorn openenterprise_twin.api.app:create_app \
            --factory --host 127.0.0.1 --port 8000 \
            >../test-results/e2e-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$oidc_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); urllib.request.urlopen('http://127.0.0.1:18081/.well-known/openid-configuration', timeout=2)"; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat ../test-results/e2e-api.log
              cat ../test-results/e2e-oidc.log
              exit 1
            fi
            sleep 1
          done
          cd ../frontend
          npm run e2e
      - name: Upload failed E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
